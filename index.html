function getWeekIndex(){
  var parts=today().split("-").map(Number);
  var d0=Date.UTC(2026,0,1);
  var d1=Date.UTC(parts[0],(parts[1]||1)-1,parts[2]||1);
  return Math.max(0,Math.floor((d1-d0)/(7*86400000)));
}
function getWeeklyRS(){
  var w=getWeekIndex(),arr=BASE_RS.slice();
  if(w%2===1)arr.push(EXTRA_WEEKLY_PACKS[0]);
  if(w%3===2)arr.push(EXTRA_WEEKLY_PACKS[1]);
  return arr;
}

function myRoles(){
  if(!ME)return[];
  if(Array.isArray(ME.roles)&&ME.roles.length)return ME.roles;
  return ME.role?[ME.role]:["pendiente"];
}
function hasRole(r){return myRoles().indexOf(r)>-1}
function isPastor(){return hasRole("pastor")}

function svgCartesianDiscipulado(B){
  var W=580,H=230,padL=34,padR=14,padT=22,padB=44;
  var plotW=W-padL-padR,plotH=H-padT-padB;
  var maxY=12;
  var lvls=[
    {lv:1,label:"Nivel 1",mx:8,c:"#1565C0"},
    {lv:2,label:"Nivel 2",mx:12,c:"#2F9E5B"},
    {lv:3,label:"Nivel 3",mx:12,c:"#8E4FC7"},
    {lv:4,label:"Nivel 4",mx:12,c:"#E07B12"},
    {lv:5,label:"Ministerio",mx:12,c:"#D6336C"}
  ];
  var gW=plotW/lvls.length;
  var svg='<div class="chart-box"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Plano cartesiano de avance por niveles y lecciones">';
  for(var y=0;y<=maxY;y+=2){
    var py=padT+plotH-(y/maxY)*plotH;
    svg+='<line x1="'+padL+'" y1="'+py+'" x2="'+(W-padR)+'" y2="'+py+'" stroke="var(--line)" stroke-dasharray="'+(y===0?'':'3,3')+'" stroke-width="'+(y===0?'1.5':'1')+'"/>';
    svg+='<text x="'+(padL-6)+'" y="'+(py+4)+'" text-anchor="end" font-size="11" fill="var(--mute)">'+y+'</text>';
  }
  svg+='<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+plotH)+'" stroke="var(--mute)" stroke-width="1.5"/>';
  svg+='<text x="10" y="'+(padT+plotH/2)+'" transform="rotate(-90 10 '+(padT+plotH/2)+')" text-anchor="middle" font-size="11" font-weight="700" fill="var(--mute)">Lecciones / Pasos</text>';

  lvls.forEach(function(g,gi){
    var gx=padL+gi*gW;
    if(gi>0)svg+='<line x1="'+gx+'" y1="'+padT+'" x2="'+gx+'" y2="'+(padT+plotH)+'" stroke="var(--line)" stroke-width="1"/>';
    var items=B.filter(function(p){return p.level===g.lv}).sort(function(a,b){return(b.step||1)-(a.step||1)});
    var refH=(g.mx/maxY)*plotH;
    svg+='<rect x="'+(gx+6)+'" y="'+(padT+plotH-refH)+'" width="'+(gW-12)+'" height="'+refH+'" rx="6" fill="'+g.c+'" opacity="0.08"/>';
    if(items.length){
      var innerW=gW-16;
      var colW=Math.min(22,Math.max(6,(innerW-(items.length-1)*3)/items.length));
      var totalColsW=items.length*colW+(items.length-1)*3;
      var startX=gx+(gW-totalColsW)/2;
      items.forEach(function(p,pi){
        var st=Math.min(maxY,Math.max(1,p.level>=5?12:(p.step||1)));
        var ch=(st/maxY)*plotH;
        var cx=startX+pi*(colW+3);
        var cy=padT+plotH-ch;
        var col=SC[p.status]?SC[p.status][0]:g.c;
        svg+='<g style="cursor:pointer" onclick="S.tb='+p.id+';draw()"><title>'+esc(p.name)+' · Paso '+st+' de '+g.mx+'</title>';
        svg+='<rect x="'+cx+'" y="'+cy+'" width="'+colW+'" height="'+ch+'" rx="4" fill="'+col+'"/>';
        if(colW>=11)svg+='<text x="'+(cx+colW/2)+'" y="'+(cy-4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">'+st+'</text>';
        svg+='</g>';
      });
    }else{
      svg+='<text x="'+(gx+gW/2)+'" y="'+(padT+plotH-8)+'" text-anchor="middle" font-size="11" fill="var(--mute)">0</text>';
    }
    svg+='<text x="'+(gx+gW/2)+'" y="'+(padT+plotH+15)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">'+g.label+'</text>';
    svg+='<text x="'+(gx+gW/2)+'" y="'+(padT+plotH+28)+'" text-anchor="middle" font-size="10" fill="var(--mute)">('+items.length+' pers.)</text>';
  });
  svg+='</svg></div>';
  return svg;
}

function svgAreaLineChart(labels,values,color){
  var W=560,H=165,padL=32,padR=16,padT=20,padB=30;
  var plotW=W-padL-padR,plotH=H-padT-padB;
  var mx=Math.max.apply(null,values.concat([5]));
  var pts=values.map(function(v,i){
    var x=padL+(values.length>1?(i/(values.length-1))*plotW:plotW/2);
    var y=padT+plotH-(v/mx)*plotH;
    return{x:x,y:y,v:v,l:labels[i]};
  });
  var lineD=pts.map(function(p,i){return(i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)}).join(" ");
  var areaD=lineD+" L"+pts[pts.length-1].x.toFixed(1)+","+(padT+plotH)+" L"+pts[0].x.toFixed(1)+","+(padT+plotH)+" Z";
  var svg='<div class="chart-box"><svg viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity="0.38"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0.02"/></linearGradient></defs>';
  for(var g=0;g<=3;g++){
    var gy=padT+(g/3)*plotH,val=Math.round(mx*(1-g/3));
    svg+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--line)" stroke-dasharray="3,3"/>';
    svg+='<text x="'+(padL-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="11" fill="var(--mute)">'+val+'</text>';
  }
  svg+='<path d="'+areaD+'" fill="url(#areaGrad)"/>';
  svg+='<path d="'+lineD+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach(function(p){
    svg+='<circle cx="'+p.x+'" cy="'+p.y+'" r="4.5" fill="var(--card)" stroke="'+color+'" stroke-width="2.5"/>';
    svg+='<text x="'+p.x+'" y="'+(p.y-8)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">'+p.v+'</text>';
    svg+='<text x="'+p.x+'" y="'+(padT+plotH+18)+'" text-anchor="middle" font-size="11" fill="var(--mute)">'+esc(p.l)+'</text>';
  });
  svg+='</svg></div>';
  return svg;
}

function svgGroupedFinanceChart(months,incVals,expVals){
  var W=560,H=185,padL=46,padR=14,padT=20,padB=32;
  var plotW=W-padL-padR,plotH=H-padT-padB;
  var mx=Math.max.apply(null,incVals.concat(expVals,[1000]));
  var gW=plotW/months.length;
  var svg='<div class="chart-box"><svg viewBox="0 0 '+W+' '+H+'">';
  for(var g=0;g<=3;g++){
    var gy=padT+(g/3)*plotH,val=Math.round((mx*(1-g/3))/1000);
    svg+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--line)" stroke-dasharray="3,3"/>';
    svg+='<text x="'+(padL-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="11" fill="var(--mute)">$'+val+'k</text>';
  }
  months.forEach(function(m,i){
    var gx=padL+i*gW,cx=gx+gW/2;
    var bw=Math.min(20,gW*0.32);
    var h1=(incVals[i]/mx)*plotH,h2=(expVals[i]/mx)*plotH;
    svg+='<rect x="'+(cx-bw-2)+'" y="'+(padT+plotH-h1)+'" width="'+bw+'" height="'+Math.max(2,h1)+'" rx="4" fill="#2F9E5B"><title>Ingresos: '+FM(incVals[i])+'</title></rect>';
    svg+='<rect x="'+(cx+2)+'" y="'+(padT+plotH-h2)+'" width="'+bw+'" height="'+Math.max(2,h2)+'" rx="4" fill="#E07B12"><title>Egresos: '+FM(expVals[i])+'</title></rect>';
    svg+='<text x="'+cx+'" y="'+(padT+plotH+18)+'" text-anchor="middle" font-size="11" font-weight="600" fill="var(--mute)">'+esc(m)+'</text>';
  });
  svg+='</svg></div><div class="chart-leg"><span><i style="background:#2F9E5B"></i>Ingresos</span><span><i style="background:#E07B12"></i>Egresos</span></div>';
  return svg;
}

function svgDonutChart(items){
  var tot=items.reduce(function(s,x){return s+x.val},0);
  if(!tot)return'';
  var R=54,cx=72,cy=72,circ=2*Math.PI*R,acc=0;
  var svg='<div class="donut-wrap"><svg width="144" height="144" viewBox="0 0 144 144">';
  items.forEach(function(it){
    if(!it.val)return;
    var dash=(it.val/tot)*circ;
    svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+it.color+'" stroke-width="22" stroke-dasharray="'+dash.toFixed(2)+' '+circ.toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    acc+=dash;
  });
  svg+='<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">'+tot+'</text>';
  svg+='<text x="'+cx+'" y="'+(cy+13)+'" text-anchor="middle" font-size="11" fill="var(--mute)">Total</text></svg>';
  svg+='<div style="flex:1;min-width:170px">';
  items.forEach(function(it){
    var pc=Math.round((it.val/tot)*100);
    svg+='<div style="display:flex;justify-content:space-between;align-items:center;font-size:16px;padding:4px 0;border-bottom:1px solid var(--line)"><span><i style="display:inline-block;width:11px;height:11px;border-radius:50%;background:'+it.color+';margin-right:6px"></i>'+esc(it.label)+'</span><b>'+it.val+' ('+pc+'%)</b></div>';
  });
  svg+='</div></div>';
  return svg;
}

  svg+='<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink)">'+Math.round(pct*100)+'%</text></svg>';

function chatView(){
  var isPriv=S.chat_ch==="privado";
  var groups=["General","Servidores","Alabanza","Líderes","Discipuladores"].concat(CELLS);
  if(!S.chat_priv_target)S.chat_priv_target=groups[0];
  var msgs=S.chat_msgs.filter(function(m){
    if(!isPriv)return m.scope==="publico";
    return m.scope==="privado"&&m.group_name===S.chat_priv_target;
  }).slice().reverse();

  var h='<div class="card t-verde"><h3>💬 '+(isPriv?"Chat privado · "+esc(S.chat_priv_target):"Chat público de la iglesia")+'</h3>';
  h+='<div class="chips"><button class="chip" aria-pressed="'+(!isPriv)+'" onclick="S.chat_ch=\'general\';draw()">🌐 Público</button><button class="chip" aria-pressed="'+isPriv+'" onclick="S.chat_ch=\'privado\';draw()">🔒 Privado por grupo</button></div>';
  if(isPriv){
    h+='<label>Grupo privado</label><select onchange="S.chat_priv_target=this.value;draw()">'+groups.map(function(g){return'<option value="'+esc(g)+'"'+(S.chat_priv_target===g?" selected":"")+'>'+esc(g)+'</option>'}).join("")+'</select>';
  }
  h+='<div class="chat-box">';
  if(!msgs.length){
    h+='<p class="note">Aún no hay mensajes en este canal. ¡Escribe el primero!</p>';
  }else{
    h+=msgs.map(function(m){
      var mine=m.author===ME.name||m.author===U.email;
      return'<div class="chat-msg'+(mine?" mine":"")+'"><div style="display:flex;justify-content:space-between;gap:8px"><b>'+esc(m.author||"Miembro")+'</b><small class="note">'+esc(m.time||"")+'</small></div><p style="margin:6px 0 0">'+esc(m.text)+'</p></div>';
    }).join("");
  }
  h+='</div>';
  h+='<label>Mensaje</label><input id="chat_in" placeholder="Escribe un mensaje..." onkeydown="if(event.key===\'Enter\')sendChatMsg()">';
  h+='<button class="btn" onclick="sendChatMsg()">📤 Enviar mensaje</button></div>';
  return h;
}
function sendChatMsg(){
  var el=$("chat_in");if(!el)return;
  var tx=el.value.trim();if(!tx){toast("Escribe un mensaje");return}
  var isPriv=S.chat_ch==="privado";
  var tm=new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
  S.chat_msgs.push({id:Date.now(),scope:isPriv?"privado":"publico",group_name:isPriv?S.chat_priv_target:"general",author:ME.name||U.email,text:tx,time:fd(today())+" "+tm});

}

  S.dl_ans={};
  if(l.is_final){
    toast("🎉 ¡Felicitaciones! Aprobaste el Nivel 1 y ganaste tu insignia.");
    S.dl_open=null;
  }else if(idx+1<list.length){
    toast("¡Paso aprobado! Se habilitó el siguiente paso.");
    S.dl_open=list[idx+1].id;
  }else{
    toast("¡Paso completado!");
    S.dl_open=null;
  }
  draw();
}
function renderGradCard(gName){
  var fechaGrad=new Date().toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"});
  return'<div class="grad-card"><div style="font-size:42px">🛡️🎓</div><p style="margin:4px 0;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:#8A5A2B">Iglesia ICCVGD · Discipulado</p><h3 style="font-size:24px;margin:6px 0;color:#1565C0">Certificado de Nivel 1</h3><p style="margin:6px 0;font-size:16px">Se otorga a:</p><input id="grad_in" value="'+esc(gName)+'" oninput="S.grad_name=this.value" style="text-align:center;font:700 20px Georgia,serif;border:1px dashed #8A5A2B;background:rgba(255,255,255,.7);color:#1F2430;margin:4px 0"><p style="margin:8px 0 4px;font-size:16px">Por haber completado satisfactoriamente el <b>Nivel 1 · Fundamentos de la Fe</b> (100%).</p><p style="margin:4px 0;font-size:14px;color:#59606E">Fecha: '+fechaGrad+'</p><button class="btn sm no-print" style="background:#8A5A2B;margin-top:8px" onclick="window.print()">🖨️ Guardar / Imprimir Certificado</button></div>';
}
function renderDiscipuladoHub(embedded){
  var list=n1Lessons();
  if(S.dl_open!==null){
    var cur=list.filter(function(x){return x.id===S.dl_open})[0];
    if(cur)return renderLessonReader(cur,list);
    S.dl_open=null;
  }
  var baptized=isBaptizedRole();
  var stepsOnly=list.filter(function(x){return !x.is_final});
  var doneCount=stepsOnly.filter(function(x){return isLessonDone(x.id)}).length;
  var finalItem=list.filter(function(x){return x.is_final})[0];
  var graduated=finalItem&&isLessonDone(finalItem.id);
  var pct=stepsOnly.length?Math.round((doneCount/stepsOnly.length)*100):0;
  if(!S.grad_name)S.grad_name=ME.name||U.email;

  var h=embedded?'<button class="btn alt no-print" style="margin:8px 0" onclick="S.dl_view=null;draw()">← Volver al Tablero de seguimiento</button>':'';
  h+='<div class="card"><h3>📖 Discipulado · Nivel 1</h3>';
  if(baptized){
    h+='<p class="note">Como <b>'+esc(myRoles().join(" · "))+'</b> ya eres bautizado, por lo que tienes todo el Nivel 1 habilitado para consulta y acompañamiento.</p>';
  }else{
    h+='<p class="note">Lee cada lección y aprueba su autoexamen para habilitar automáticamente el siguiente paso.</p>';
    h+='<div class="pbar"><i style="width:'+pct+'%"></i></div>';
    h+='<small><b>'+doneCount+' de '+stepsOnly.length+' pasos completados ('+pct+'%)</b></small>';
    if(graduated)h+='<div style="margin-top:8px"><span class="badge">🛡️ Escudo de la Fe · Nivel 1 Completado</span></div>';
    else if(doneCount>0)h+='<div style="margin-top:8px"><span class="badge">🌱 Discípulo en marcha ('+doneCount+'/'+stepsOnly.length+')</span></div>';
  }
  if(isPastor()){
    h+='<button class="btn alt no-print" onclick="S.dl_view=\'editor\';S.dl_ed=null;draw()">✏️ Administrar / Subir Lecciones (Pastor)</button>';
  }
  h+='</div>';

  if(graduated&&!baptized){
    h+=renderGradCard(S.grad_name);
  }

  if(!list.length){
    return h+'<div class="card"><p class="note">Aún no se han cargado las lecciones del Nivel 1.'+(isPastor()?' Toca <b>Administrar / Subir Lecciones</b> para crear los pasos.':' El pastor las habilitará pronto.')+'</p></div>';
  }

  var stepsHtml=list.map(function(l,idx){
    var unlocked=canOpenLesson(idx,list);
    var done=isLessonDone(l.id);
    var stText=baptized?"Disponible para lectura":(done?"Completado ✓":(unlocked?"Habilitado · Listo para presentar":"Bloqueado (aprueba el paso anterior)"));
    var icon=l.is_final?"🎓":(done?"✅":(unlocked?"📖":"🔒"));
    var bg=l.is_final?"#D6336C":(done?"#2F9E5B":(unlocked?"#1565C0":"#90A4AE"));
    return'<div class="card no-print"><button class="row" style="border:0;background:none;padding:0;opacity:'+(unlocked?1:.55)+'" onclick="'+(unlocked?'S.dl_open='+l.id+';S.dl_ans={};draw()':'toast(\'Aprueba el paso anterior para habilitar este\')')+'">'+
      '<span class="av" style="background:'+bg+'">'+icon+'</span>'+
      '<span class="grow"><b>'+(l.is_final?esc(l.title):"Paso "+l.step+": "+esc(l.title))+'</b><small>'+stText+'</small></span>'+
      '<span class="pill" style="background:'+bg+'">'+(l.is_final?"Final":(done?"Listo":(unlocked?"Abrir":"Bloqueado")))+'</span>'+
      '</button></div>';
  }).join("");
  h+=foldBtn("dl_list","📚","Pasos y lecciones del Nivel 1",list.length,"#1565C0",stepsHtml,true);
  return h;
}

// ===== EDITOR DE LECCIONES PARA EL PASTOR =====
function openLessonEditor(id){
  if(id===0){
    var nextStep=n1Lessons().filter(function(x){return !x.is_final}).length+1;
    S.dl_ed={id:0,level:1,step:nextStep,title:"",content_html:"",is_final:false};
    S.dl_q=[{q:"",o:["","",""],a:0}];
  }else{
    var l=DL.filter(function(x){return x.id===id})[0];if(!l)return;
    S.dl_ed=Object.assign({},l);
    S.dl_q=Array.isArray(l.quiz)&&l.quiz.length?JSON.parse(JSON.stringify(l.quiz)):[{q:"",o:["","",""],a:0}];
  }
  draw();
}
function syncEditorDraft(){
  if(!S.dl_ed)return;
  if($("ed_step"))S.dl_ed.step=parseInt($("ed_step").value)||1;
  if($("ed_fin"))S.dl_ed.is_final=$("ed_fin").checked;
  if($("ed_tit"))S.dl_ed.title=$("ed_tit").value;
  if($("ed_cnt"))S.dl_ed.content_html=$("ed_cnt").value;
  S.dl_q.forEach(function(item,qi){
    if($("ed_q_"+qi))item.q=$("ed_q_"+qi).value;
    item.o.forEach(function(_,oi){if($("ed_o_"+qi+"_"+oi))item.o[oi]=$("ed_o_"+qi+"_"+oi).value});
    if($("ed_a_"+qi))item.a=parseInt($("ed_a_"+qi).value)||0;
  });
}
function renderLessonEditor(){
  var h='<button class="btn alt" style="margin:8px 0" onclick="S.dl_view=\'lessons\';S.dl_ed=null;draw()">← Volver a Lecciones Nivel 1</button>';
  if(S.dl_ed===null){
    var list=n1Lessons();
    h+='<div class="card"><h3>✏️ Editor de Lecciones · Nivel 1</h3><p class="note">Aquí puedes subir, ordenar o editar cada paso y sus preguntas de autoexamen. Los cambios se reflejan de inmediato.</p><button class="btn" onclick="openLessonEditor(0)">➕ Nueva lección / paso</button></div>';
    h+=list.length?list.map(function(l){
      return'<div class="card row"><span class="av" style="background:'+(l.is_final?"#D6336C":"#1565C0")+'">'+(l.is_final?"🎓":l.step)+'</span><span class="grow"><b>'+(l.is_final?esc(l.title):"Paso "+l.step+": "+esc(l.title))+'</b><small>'+((l.quiz||[]).length)+' pregunta(s) en autoexamen</small></span><button class="chip" onclick="openLessonEditor('+l.id+')">Editar</button></div>';
    }).join(""):'<p class="note">Aún no hay pasos creados. Toca <b>Nueva lección / paso</b> para subir el Paso 1.</p>';
    return h;
  }
  var e=S.dl_ed;
  h+='<div class="card"><h3>'+(e.id?"Editar lección":"Nueva lección · Nivel 1")+'</h3>';
  h+='<label>Número de paso</label><input id="ed_step" type="number" min="1" max="20" value="'+e.step+'">';
  h+='<label style="display:flex;gap:8px;align-items:center"><input id="ed_fin" type="checkbox" style="width:22px;height:22px"'+(e.is_final?" checked":"")+'> Es el Resumen + Examen Final del Nivel 1</label>';
  h+='<label>Título de la lección</label><input id="ed_tit" value="'+esc(e.title)+'" placeholder="Ej. Una nueva vida en Cristo">';
  h+='<label>Contenido / Enseñanza (puedes pegar texto o etiquetas HTML como &lt;p&gt;, &lt;b&gt;, &lt;blockquote&gt;)</label><textarea id="ed_cnt" rows="7" placeholder="Escribe aquí la enseñanza bíblica del paso...">'+esc(e.content_html)+'</textarea>';
  h+='</div>';

  h+='<div class="card"><h3>📝 Preguntas del Autoexamen</h3><p class="note">Configura las preguntas que el discípulo debe aprobar para desbloquear el siguiente paso.</p>';
  S.dl_q.forEach(function(q,qi){
    h+='<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center"><b>Pregunta '+(qi+1)+'</b>'+(S.dl_q.length>1?'<button class="chip" onclick="syncEditorDraft();S.dl_q.splice('+qi+',1);draw()">Quitar</button>':'')+'</div>';
    h+='<input id="ed_q_'+qi+'" value="'+esc(q.q)+'" placeholder="Escribe la pregunta..." style="margin-top:6px">';
    q.o.forEach(function(opt,oi){
      h+='<input id="ed_o_'+qi+'_'+oi+'" value="'+esc(opt)+'" placeholder="Opción '+(oi+1)+'" style="margin-top:6px">';
    });
    h+='<label>Respuesta correcta</label><select id="ed_a_'+qi+'">'+q.o.map(function(_,oi){return'<option value="'+oi+'"'+(q.a===oi?" selected":"")+'>Opción '+(oi+1)+'</option>'}).join("")+'</select>';
    h+='</div>';
  });
  h+='<button class="btn alt" onclick="syncEditorDraft();S.dl_q.push({q:\'\',o:[\'\',\'\',\'\'],a:0});draw()">➕ Agregar otra pregunta</button>';
  h+='</div>';

  h+='<button class="btn" onclick="saveLessonEditor()">💾 Guardar lección</button>';
  if(e.id)h+='<button class="btn alt" onclick="deleteLessonEditor('+e.id+')">🗑️ Eliminar lección</button>';
  h+='<button class="btn alt" onclick="S.dl_ed=null;draw()">Cancelar</button>';
  return h;
}
async function saveLessonEditor(){
  syncEditorDraft();
  var e=S.dl_ed;
  if(!e.title.trim()){toast("Escribe el título de la lección");return}
  var cleanQuiz=S.dl_q.filter(function(q){return q.q.trim()&&q.o.some(function(x){return x.trim()})}).map(function(q){
    return{q:q.q.trim(),o:q.o.map(function(x){return x.trim()||"—"}),a:q.a}
  });
  var payload={level:1,step:e.step,title:e.title.trim(),content_html:e.content_html.trim(),quiz:cleanQuiz,is_final:!!e.is_final,updated_at:new Date().toISOString()};
  var r=e.id?await SB.from("disciple_lessons").update(payload).eq("id",e.id):await SB.from("disciple_lessons").insert(payload);
  if(r.error){toast("No se pudo guardar: "+r.error.message);return}
  await load();
  S.dl_ed=null;
  toast("Lección guardada");
  draw();
}
async function deleteLessonEditor(id){
  if(!confirm("¿Eliminar esta lección?"))return;
  var r=await SB.from("disciple_lessons").delete().eq("id",id);
  if(r.error){toast("Error: "+r.error.message);return}
  await load();
  S.dl_ed=null;
  toast("Lección eliminada");
  draw();
}

function canEdit(p){return isPastor()||(isLider()&&p.cell===ME.cell)}
async function delp(){var p=P.filter(function(x){return x.id===S.sel})[0];if(!p)return;if(!confirm("¿Eliminar a "+p.name+" definitivamente? También se borrará su historial de asistencia y no se puede deshacer."))return;
var r=await SB.from("people").delete().eq("id",p.id);if(r.error){toast("No se pudo eliminar: "+r.error.message);return}await load();S.sel=null;toast("Persona eliminada");draw()}

function equipo(){
  var o=function(a,v){return a.map(function(x){return'<option'+(x===v?" selected":"")+'>'+x+'</option>'}).join("")};
  var reglas='<p class="note">Puedes asignar uno o varios roles a cada miembro del equipo (Tesorero, Líder de alabanza, Líder de servidores, Líder, Coordinador, Discipulador). Tesorero accede a Finanzas; Líder de alabanza gestiona programación e inventario de instrumentos.</p>';
  var h='<div class="card"><h3>⚙️ Equipo de líderes ('+EQ.length+')</h3></div>'+foldBtn("eq_reg","📜","Reglas de roles y permisos",null,"#1565C0",reglas,false);
  return h+EQ.map(function(q){
    var me=q.id===U.id;
    var qRoles=Array.isArray(q.roles)&&q.roles.length?q.roles:[q.role||"pendiente"];
    var rLbl=qRoles.map(function(r){return(ROLE_META[r]&&ROLE_META[r].lbl)||r}).join(", ");
    var checks=RO.map(function(r){
      var rk=r[0],checked=qRoles.indexOf(rk)>-1;
      return'<label style="display:flex;gap:8px;align-items:center;font-weight:600;margin:6px 0"><input type="checkbox" class="qchk_'+q.id+'" value="'+rk+'" style="width:20px;height:20px"'+(checked?" checked":"")+(me&&rk==="pastor"?" disabled":"")+'> '+r[1]+'</label>';
    }).join("");
    var body='<label>Roles asignados</label><div>'+checks+'</div><label>Célula</label><select id="qc'+q.id+'"><option value="">Sin célula</option>'+o(CELLS,q.cell)+'</select><button class="btn" onclick="saveq(\''+q.id+'\')">💾 Guardar cambios</button>';
    return foldBtn("eq_"+q.id,ROL_EMO[qRoles[0]]||"👤",esc(q.name||"Sin nombre")+(me?" (tú)":""),rLbl,qRoles.indexOf("pendiente")>-1?"#E07B12":"#2F9E5B",body,qRoles.indexOf("pendiente")>-1);
  }).join("")}
async function saveq(id){
  var boxes=Array.prototype.slice.call(document.querySelectorAll(".qchk_"+id));
  var selRoles=boxes.filter(function(b){return b.checked}).map(function(b){return b.value});
  if(id===U.id&&selRoles.indexOf("pastor")<0)selRoles.unshift("pastor");
  if(!selRoles.length)selRoles=["pendiente"];
  var primaryRole=selRoles[0];
  var r=await SB.from("profiles").update({role:primaryRole,roles:selRoles,cell:$("qc"+id).value||null}).eq("id",id);
  if(r.error){toast(r.error.message.indexOf("max_coordinadores")>-1?"Ya hay 2 coordinadores. Cambia primero el rol de uno de ellos.":"No se pudo guardar: "+r.error.message);return}
  await load();toast("Equipo actualizado");draw()
}

// ===== NAVEGACIÓN INFERIOR COMPACTA CON PÍLDORA ACTIVA Y MENÚ "MÁS" =====
function switchTab(id){
  S.tab=id;S.sel=null;S.tb=null;S.ce=null;S.ia=null;S.pn=false;S.tn=false;S.ft=null;S.dl_view=null;S.dl_open=null;S.dl_ed=null;S.more=false;
  draw();
}
function draw(){
  renderHeader();
  var T=[["ini","🏠","Inicio"],["reg","👥","Registro"],["asis","✅","Asistencia"],["panel","📊","Panel"],["cel","🏘️","Células"],["tabl","🗂️","Tablero"],["inf","📄","Informe"],["rend","📝","Rendición"],["com","🙌","Comunidad"],["retos","🧩","Retos"],["fin","💰","Finanzas"],["equipo","⚙️","Equipo"]];
  $("nav").style.display=ME?"flex":"none";
  $("more_box").innerHTML="";
  $("modal_box").innerHTML=S.dev_modal?renderDevotionalModal():(S.tr_modal?renderTransversalesModal():"");
  if(S.rec||(S.pw&&ME)){$("nav").style.display="none";$("app").innerHTML=pwform();return}
  if(!ME){$("app").innerHTML=authv();return}
  if(ME.role==="pendiente"&&myRoles().length===1&&myRoles()[0]==="pendiente"){$("nav").style.display="none";$("app").innerHTML='<div class="card"><h3>⏳ Tu cuenta espera aprobación</h3><p>El pastor debe asignarte un rol para que puedas ver la información de la iglesia. Cuando lo haga, toca Salir y vuelve a entrar.</p></div>';return}
  var al=allowedTabsForMe();if(al.indexOf(S.tab)<0)S.tab=al[0];
  var allowedTabs=T.filter(function(t){return al.indexOf(t[0])>-1});
  var primaryIds=al.indexOf("asis")>-1?["ini","reg","asis","tabl"]:["ini","reg","panel","tabl"];
  var primaryTabs=allowedTabs.filter(function(t){return primaryIds.indexOf(t[0])>-1});
  var extraTabs=allowedTabs.filter(function(t){return primaryIds.indexOf(t[0])<0});
  var isExtraActive=extraTabs.some(function(t){return t[0]===S.tab});

  var navHtml=primaryTabs.map(function(t){
    return'<button aria-current="'+(S.tab===t[0])+'" onclick="switchTab(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>';
  }).join("");
  if(extraTabs.length){
    navHtml+='<button aria-current="'+(isExtraActive||S.more)+'" onclick="S.more=!S.more;draw()"><span>⋯</span>Más</button>';
  }
  $("nav").innerHTML=navHtml;

  if(S.more&&extraTabs.length){
    $("more_box").innerHTML='<div class="more-pop" onclick="if(event.target===this){S.more=false;draw()}"><div class="more-sheet"><div style="display:flex;justify-content:space-between;align-items:center"><b>Más secciones</b><button class="chip" onclick="S.more=false;draw()">✕ Cerrar</button></div><div class="more-grid">'+extraTabs.map(function(t){return'<button class="more-item" aria-current="'+(S.tab===t[0])+'" onclick="switchTab(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("")+'</div></div></div>';
  }

  $("app").innerHTML=S.tab==="reg"?reg():S.tab==="asis"?asis():S.tab==="ini"?inicio():S.tab==="inf"?informe():S.tab==="rend"?rendicion():S.tab==="fin"&&canEditFinanzas()?finanzas():S.tab==="com"?comunidad():S.tab==="cel"?celulas():S.tab==="tabl"?tablero():S.tab==="retos"?retos():S.tab==="equipo"&&isPastor()?equipo():panel();
  var q=$("q");if(q)q.oninput=function(){S.q=q.value;var p=q.selectionStart;draw();var n=$("q");if(n){n.focus();n.setSelectionRange(p,p)}}
  var aq=$("aq");if(aq)aq.oninput=function(){S.aq=aq.value;var p=aq.selectionStart;draw();var n=$("aq");if(n){n.focus();n.setSelectionRange(p,p)}}
}
if(location.hash.indexOf("type=recovery")>-1)S.rec=true;
SB.auth.onAuthStateChange(function(ev){if(ev==="PASSWORD_RECOVERY"){S.rec=true;draw()}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
boot();
</script></body></html>
