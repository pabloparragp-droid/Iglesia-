// ===== MÓDULO DE FINANZAS =====
var INC_CATS=[], EXP_CATS=[], TRANS=[], FIN_LOADED=false;

async function loadFinance() {
  var ic = await SB.from("income_categories").select("*").order("name");
  var ec = await SB.from("expense_categories").select("*").order("name");
  var tr = await SB.from("transactions").select("*, income_categories(name, color), expense_categories(name, color)").order("date", {ascending: false});
  if (!ic.error) INC_CATS = ic.data || [];
  if (!ec.error) EXP_CATS = ec.data || [];
  if (!tr.error) TRANS = tr.data || [];
  FIN_LOADED = true;
}

function finanzas() {
  if (!FIN_LOADED) { loadFinance(); }
  var mes = new Date().getMonth() + 1;
  var anio = new Date().getFullYear();
  var transMes = TRANS.filter(function(t) {
    var d = new Date(t.date);
    return d.getMonth() + 1 === mes && d.getFullYear() === anio;
  });
  var totalIngresos = transMes.filter(function(t) { return t.type === 'income'; }).reduce(function(s, t) { return s + parseFloat(t.amount); }, 0);
  var totalEgresos = transMes.filter(function(t) { return t.type === 'expense'; }).reduce(function(s, t) { return s + parseFloat(t.amount); }, 0);
  var balance = totalIngresos - totalEgresos;
  var html = '<div class="card"><h3>💰 Finanzas - ' + ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"][mes-1] + ' ' + anio + '</h3>';
  html += '<div class="stats">';
  html += '<div class="stat" style="background:#2F9E5B"><b>$' + Math.round(totalIngresos).toLocaleString() + '</b>Ingresos</div>';
  html += '<div class="stat" style="background:#E07B12"><b>$' + Math.round(totalEgresos).toLocaleString() + '</b>Egresos</div>';
  html += '<div class="stat" style="background:' + (balance >= 0 ? '#1565C0' : '#D6336C') + '"><b>$' + Math.round(balance).toLocaleString() + '</b>Balance</div>';
  html += '</div></div>';
  html += '<button class="btn" onclick="S.ft=\'income\';draw()">+ Registrar ingreso</button>';
  html += '<button class="btn alt" onclick="S.ft=\'expense\';draw()">- Registrar egreso</button>';
  html += '<h3 style="margin:20px 0 10px">Transacciones del mes</h3>';
  if (transMes.length === 0) {
    html += '<p class="note">No hay transacciones este mes.</p>';
  } else {
    transMes.forEach(function(t) {
      var cat = t.type === 'income' ? t.income_categories : t.expense_categories;
      var color = cat ? cat.color : '#999';
      var nombre = cat ? cat.name : 'Sin categoría';
      var signo = t.type === 'income' ? '+' : '-';
      var colorTexto = t.type === 'income' ? '#2F9E5B' : '#E07B12';
      html += '<div class="card" style="display:flex;align-items:center;gap:10px">';
      html += '<div style="width:4px;height:40px;background:' + color + ';border-radius:2px"></div>';
      html += '<div class="grow"><b>' + nombre + '</b><br><small>' + (t.description || '') + ' · ' + t.date + '</small></div>';
      html += '<b style="color:' + colorTexto + ';font-size:18px">' + signo + '$' + Math.round(parseFloat(t.amount)).toLocaleString() + '</b>';
      html += '<button class="chip" onclick="delTrans(' + t.id + ')" style="margin-left:8px">🗑️</button>';
      html += '</div>';
    });
  }
  html += '<button class="btn alt" onclick="exportReport()">📥 Exportar informe CSV</button>';
  return html;
}

function formTrans() {
  var tipo = S.ft;
  var cats = tipo === 'income' ? INC_CATS : EXP_CATS;
  var html = '<div class="card"><h3>' + (tipo === 'income' ? 'Registrar ingreso' : 'Registrar egreso') + '</h3>';
  html += '<label>Categoría</label><select id="tc">';
  cats.forEach(function(c) {
    html += '<option value="' + c.id + '">' + c.name + '</option>';
  });
  html += '</select>';
  html += '<label>Monto</label><input id="ta" type="number" step="0.01" placeholder="0.00">';
  html += '<label>Descripción (opcional)</label><input id="td" placeholder="Ej. Diezmo de Juan Pérez">';
  html += '<label>Fecha</label><input id="tf" type="date" value="' + today() + '">';
  html += '<button class="btn" onclick="saveTrans()">Guardar</button>';
  html += '<button class="btn alt" onclick="S.ft=null;draw()">Cancelar</button>';
  html += '</div>';
  return html;
}

async function saveTrans() {
  var catId = $("tc").value;
  var amount = $("ta").value;
  var desc = $("td").value;
  var date = $("tf").value;
  if (!amount || amount <= 0) { toast("Ingresa un monto válido"); return; }
  if (!date) { toast("Selecciona una fecha"); return; }
  var data = {
    type: S.ft,
    category_id: parseInt(catId),
    amount: parseFloat(amount),
    description: desc,
    date: date,
    created_by: U.id
  };
  var r = await SB.from("transactions").insert(data);
  if (r.error) { toast("Error: " + r.error.message); return; }
  FIN_LOADED = false;
  await loadFinance();
  S.ft = null;
  toast("Transacción registrada");
  draw();
}

async function delTrans(id) {
  if (!confirm("¿Eliminar esta transacción?")) return;
  var r = await SB.from("transactions").delete().eq("id", id);
  if (r.error) { toast("Error: " + r.error.message); return; }
  FIN_LOADED = false;
  await loadFinance();
  toast("Transacción eliminada");
  draw();
}

function exportReport() {
  var mes = new Date().getMonth() + 1;
  var anio = new Date().getFullYear();
  var transMes = TRANS.filter(function(t) {
    var d = new Date(t.date);
    return d.getMonth() + 1 === mes && d.getFullYear() === anio;
  });
  var totalIngresos = transMes.filter(function(t) { return t.type === 'income'; }).reduce(function(s, t) { return s + parseFloat(t.amount); }, 0);
  var totalEgresos = transMes.filter(function(t) { return t.type === 'expense'; }).reduce(function(s, t) { return s + parseFloat(t.amount); }, 0);
  var csv = 'Tipo,Categoría,Monto,Descripción,Fecha\n';
  transMes.forEach(function(t) {
    var cat = t.type === 'income' ? t.income_categories.name : t.expense_categories.name;
    csv += (t.type === 'income' ? 'Ingreso' : 'Egreso') + ',' + cat + ',' + t.amount + ',"' + (t.description || '') + '",' + t.date + '\n';
  });
  csv += '\nTotal Ingresos,,' + totalIngresos + ',,\n';
  csv += 'Total Egresos,,' + totalEgresos + ',,\n';
  csv += 'Balance,,' + (totalIngresos - totalEgresos) + ',,\n';
  var blob = new Blob([csv], { type: 'text/csv' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'finanzas_' + anio + '_' + mes + '.csv';
  a.click();
}

var a=await SB.from(ME.role==="servidor"?"people_light":"people").select("*").order("name"),b=await SB.from("attendance").select("person_id,event_date,event,present").gte("event_date",d),c=await SB.from("retos").select("key,pts");
if(a.error)toast("Error al cargar: "+a.err
