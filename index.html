  var yr=today().slice(0,4);
  var md=b.slice(5,7)+b.slice(8,10);
  var dtStart=yr+md;
  var dObj=new Date(Number(yr),Number(b.slice(5,7))-1,Number(b.slice(8,10))+1);
  var dtEnd=dObj.getFullYear()+String(dObj.getMonth()+1).padStart(2,"0")+String(dObj.getDate()).padStart(2,"0");

}

// Genera ID consecutivo de 1 letra + 1 número (A1..A9, B1..B9, C1..C9...) según orden de registro/tablero
function buildDiscipleCodeMap(boardList){
  var sorted=boardList.slice().sort(function(a,b){return(a.id||0)-(b.id||0)});
  var map={};
  sorted.forEach(function(p,idx){
    var letterIdx=Math.floor(idx/9);
    var letter=String.fromCharCode(65+(letterIdx%26));
    var num=(idx%9)+1;
    map[p.id]=letter+String(num);
  });
  return map;
}

// Movimiento rápido de lección o nivel directamente desde el tablero tipo Trello
async function quickMoveDisciple(personId,deltaStep,deltaLvl){
  var p=P.filter(function(x){return x.id===personId})[0];
  if(!p||!canMove(p)){toast("No tienes permiso para mover esta ficha");return}
  var curLv=p.level||1;
  var curSt=p.step||1;
  var newLv=curLv;
  var newSt=curSt;
  var newStatus=p.status||"al_dia";

  if(deltaLvl!==0){
    newLv=Math.min(5,Math.max(1,curLv+deltaLvl));
    newSt=1;
    newStatus="al_dia";
  }else if(deltaStep!==0){
    var maxSt=MX[curLv]||12;
    newSt=curSt+deltaStep;
    if(newSt>maxSt){
      if(curLv<5){newLv=curLv+1;newSt=1;newStatus="al_dia";}
      else{newSt=maxSt;}
    }else if(newSt<1){
      if(curLv>1){newLv=curLv-1;newSt=MX[newLv]||8;}
      else{newSt=1;}
    }
  }
  var newLvlStr=newLv<5?("Nivel "+newLv+" · Paso "+newSt):"Sirviendo en la iglesia";
  var r=isDiscipulador()&&!isPastor()&&!isCellLeaderOrAsst()
    ?await SB.rpc("move_disciple",{p_id:p.id,p_level:newLv,p_step:newSt,p_status:newStatus,p_companion:p.companion||"",p_started:p.started||null,p_lvl:newLvlStr})
    :await SB.from("people").update({level:newLv,step:newSt,status:newStatus,lvl:newLvlStr}).eq("id",p.id);
  if(r.error){toast("No se pudo mover: "+r.error.message);return}
  await load();
  toast("Ficha movida a "+newLvlStr);
  draw();
}

function bdayCard(){

    return b&&String(b).length>=10&&String(b).slice(5,7)===curM;
  }).sort(function(a,b){
    var da=+(a.birthday||a.birth_date).slice(8,10),db=+(b.birthday||b.birth_date).slice(8,10);
    return da-db;
  });
  var allWithBday=P.filter(function(p){var b=p.birthday||p.birth_date;return b&&String(b).length>=10});
  if(!bdays.length&&!allWithBday.length)return'';
  var h='<div style="margin-bottom:8px"><button class="btn alt sm" style="margin:0" onclick="exportBirthdaysICS()">📅 Sincronizar todos con Google Calendar (.ics)</button></div>';

    return h;
  }
  bdays.forEach(function(p){
    var b=p.birthday||p.birth_date,day=+b.slice(8,10),isToday=day===curD;

    var dTel=String(p.tel||"").replace(/\D/g,"");if(dTel.length===10)dTel=CC+dTel;

    h+='<div style="display:flex;gap:6px;flex:none">';
    if(calUrl)h+='<a class="chip" style="text-decoration:none;border-color:#1565C0;color:#1565C0;padding:6px 10px;font-size:15px" href="'+calUrl+'" target="_blank" rel="noopener" title="Agendar en Google Calendar">📅</a>';
    if(p.tel)h+='<a class="chip" style="text-decoration:none;border-color:#25D366;color:#25D366;padding:6px 10px;font-size:15px" href="https://wa.me/'+dTel+'?text='+encodeURIComponent(MSG.cumple.replace("{n}",p.name.split(" ")[0]))+'" target="_blank" rel="noopener">🎂</a>';

      var rk=r[0],checked=qRoles.indexOf(rk)>-1;
      return'<label style="display:flex;gap:8px;align-items:center;font-weight:600;margin:6px 0"><input type="checkbox" class="qchk_'+q.id+'" value="'+rk+'" style="width:20px;height:20px"'+(checked?" checked":"")+(me&&rk==="pastor"?" disabled":"")+'> '+r[1]+'</label>';
    }).join("");
    var body='<label>Roles asignados</label><div>'+checks+'</div><label>Célula</label><select id="qc'+q.id+'"><option value="">Sin célula</option>'+o(CELLS,q.cell)+'</select><button class="btn" onclick="saveq(\''+q.id+'\')">💾 Guardar cambios</button>';
    return foldBtn("eq_"+q.id,ROL_EMO[qRoles[0]]||"👤",esc(q.name||"Sin nombre")+(me?" (tú)":""),rLbl,qRoles.indexOf("pendiente")>-1?"#E07B12":"#2F9E5B",body,qRoles.indexOf("pendiente")>-1);
  }).join("")}
function mapDbRole(selRoles){
  var STD=["pastor","lider","coordinador","discipulador","servidor","discipulo","pendiente"];
  for(var i=0;i<selRoles.length;i++){
    if(STD.indexOf(selRoles[i])>-1)return selRoles[i];
  }
  if(selRoles.indexOf("lider_celula")>-1||selRoles.indexOf("asistente_lider")>-1)return"lider";
  if(selRoles.indexOf("miembro")>-1)return"discipulo";
  if(selRoles.indexOf("tesorero")>-1||selRoles.indexOf("lider_alabanza")>-1||selRoles.indexOf("asistencia_alabanza")>-1||selRoles.indexOf("lider_servidores")>-1)return"servidor";
  return"pendiente";
}
async function saveq(id){
  var boxes=Array.prototype.slice.call(document.querySelectorAll(".qchk_"+id));
  var selRoles=boxes.filter(function(b){return b.checked}).map(function(b){return b.value});
  if(id===U.id&&selRoles.indexOf("pastor")<0)selRoles.unshift("pastor");
  if(!selRoles.length)selRoles=["pendiente"];
  var dbRole=mapDbRole(selRoles);
  var payload={role:dbRole,roles:selRoles,cell:$("qc"+id).value||null};
  var r=await SB.from("profiles").update(payload).eq("id",id);
  if(r.error&&r.error.message&&r.error.message.indexOf('column "roles"')>-1){
    r=await SB.from("profiles").update({role:dbRole,cell:$("qc"+id).value||null}).eq("id",id);
    if(!r.error){
      try{var m=lget("role_combos",{});m[id]=selRoles;lset("role_combos",m);}catch(e){}
      await load();toast("Roles guardados (ejecuta el SQL para persistir roles múltiples en BD)");draw();return;
    }
  }
  if(r.error){toast(r.error.message.indexOf("max_coordinadores")>-1?"Ya hay 2 coordinadores. Cambia primero el rol de uno de ellos.":"No se pudo guardar: "+r.error.message);return}
  await load();toast("Equipo actualizado");draw()
}

function canManageRetiro(){return isPastor()||isCoordinador()||isCellLeaderOrAsst()}
function retiroTotales(){
  var tarifa=Math.max(0,Number(S.retiro_cfg.tarifa)||0);
  var list=S.retiro_list||[];
  var confirmados=list.filter(function(x){return x.confirmado});
  var abonaron=list.filter(function(x){return(Number(x.abono)||0)>0});
  var recaudado=list.reduce(function(s,x){return s+(Number(x.abono)||0)},0);
  var esperado=confirmados.reduce(function(s,x){
    var tInd=(x.tarifa_ind!=null&&x.tarifa_ind!=="")?Number(x.tarifa_ind):tarifa;
    return s+Math.max(0,tInd);
  },0);
  var deudaTotal=confirmados.reduce(function(s,x){
    var tInd=(x.tarifa_ind!=null&&x.tarifa_ind!=="")?Number(x.tarifa_ind):tarifa;
    var deb=Math.max(0,tInd-(Number(x.abono)||0));
    return s+deb;
  },0);
  return{tarifa:tarifa,totalReg:list.length,confirmados:confirmados.length,abonaron:abonaron.length,recaudado:recaudado,esperado:esperado,deudaTotal:deudaTotal};
}
function saveRetiroCfg(){
  S.retiro_cfg={
    nombre:($("rt_nom").value.trim()||"Retiro Espiritual"),
    fecha:$("rt_fec").value||"",
    tarifa:Math.max(0,parseFloat($("rt_tar").value)||0),
    lugar:$("rt_lug").value.trim(),
    notas:$("rt_not").value.trim()
  };
  lset("retiro_cfg",S.retiro_cfg);
  toast("Tarifa y datos del retiro guardados");
  draw();
}
function addRetiroInscrito(){
  var pid=$("rt_psel")?$("rt_psel").value:"";
  var nomCustom=$("rt_pnom")?$("rt_pnom").value.trim():"";
  var nombre="",tel="",cell="";
  if(pid){
    var pObj=P.filter(function(p){return String(p.id)===String(pid)})[0];
    if(pObj){nombre=pObj.name;tel=pObj.tel||"";cell=pObj.cell||"";}
  }else if(nomCustom){
    nombre=nomCustom;
    tel=$("rt_ptel")?$("rt_ptel").value.trim():"";
  }
  if(!nombre){toast("Selecciona una persona o escribe el nombre");return}
  var yaExiste=S.retiro_list.some(function(x){return(pid&&String(x.person_id)===String(pid))||x.nombre.toLowerCase()===nombre.toLowerCase()});
  if(yaExiste){toast("Esta persona ya está en la lista del retiro");return}
  var conf=$("rt_pconf")?$("rt_pconf").checked:true;
  var abono=Math.max(0,parseFloat($("rt_pabo").value)||0);
  var medio=$("rt_pmed")?$("rt_pmed").value:"Efectivo";
  var nota=$("rt_pnot")?$("rt_pnot").value.trim():"";
  var abonosHist=abono>0?[{fecha:today(),monto:abono,medio:medio,nota:nota||"Abono inicial"}]:[];
  S.retiro_list.unshift({
    id:Date.now(),
    person_id:pid||null,
    nombre:nombre,
    tel:tel,
    cell:cell,
    confirmado:conf,
    abono:abono,
    medio:abono>0?medio:"Sin abono",
    abonos:abonosHist,
    nota:nota
  });
  lset("retiro_list",S.retiro_list);
  toast("Inscripción agregada al retiro");
  draw();
}
function registrarAbonoRetiro(id){
  var item=S.retiro_list.filter(function(x){return x.id===id})[0];
  if(!item)return;
  var montoEl=$("ab_m_"+id),medEl=$("ab_w_"+id),notEl=$("ab_n_"+id);
  var monto=montoEl?parseFloat(montoEl.value)||0:0;
  if(!(monto>0)){toast("Escribe un valor de abono mayor a cero");return}
  var medio=medEl?medEl.value:"Efectivo";
  var nota=notEl?notEl.value.trim():"";
  item.abono=(Number(item.abono)||0)+monto;
  item.medio=medio;
  item.confirmado=true;
  if(!Array.isArray(item.abonos))item.abonos=[];
  item.abonos.push({fecha:today(),monto:monto,medio:medio,nota:nota});
  lset("retiro_list",S.retiro_list);
  toast("Abono de "+FM(monto)+" registrado ("+medio+")");
  draw();
}
function toggleConfirmRetiro(id){
  var item=S.retiro_list.filter(function(x){return x.id===id})[0];
  if(!item)return;
  item.confirmado=!item.confirmado;
  lset("retiro_list",S.retiro_list);
  toast(item.confirmado?"Asistencia confirmada":"Marcado como pendiente por confirmar");
  draw();

function delRetiroItem(id){
  if(!confirm("¿Quitar a esta persona del control del retiro?"))return;
  S.retiro_list=S.retiro_list.filter(function(x){return x.id!==id});
  lset("retiro_list",S.retiro_list);
  toast("Registro eliminado");
  draw();
}
function exportRetiroCSV(){
  var tot=retiroTotales(),q=function(s){return'"'+String(s==null?"":s).replace(/"/g,'""')+'"'};
  var c="Nombre,Célula,Confirmado,Tarifa Estimada,Total Abonado,Saldo Pendiente,Último Medio de Abono,Detalle Abonos,Notas\n";
  S.retiro_list.forEach(function(x){
    var tInd=(x.tarifa_ind!=null&&x.tarifa_ind!=="")?Number(x.tarifa_ind):tot.tarifa;
    var ab=Number(x.abono)||0;
    var deb=Math.max(0,tInd-ab);
    var det=(x.abonos||[]).map(function(a){return a.fecha+": "+a.monto+" ("+a.medio+")"}).join(" | ");
    c+=[q(x.nombre),q(x.cell||""),q(x.confirmado?"Sí":"No"),tInd,ab,deb,q(x.medio||""),q(det),q(x.nota||"")].join(",")+"\n";
  });
  c+="\nConfirmados,"+tot.confirmados+"\nTotal Recaudado,"+tot.recaudado+"\nSaldo Total por Cobrar,"+tot.deudaTotal+"\n";
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+c],{type:"text/csv;charset=utf-8"}));
  a.download="control_retiro_"+today()+".csv";
  a.click();
  toast("Reporte de retiro exportado en CSV");
}

function draw(){
  renderHeader();
  var T=[["ini","🏠","Inicio"],["reg","👥","Registro"],["asis","✅","Asistencia"],["retiro","⛺","Retiro"],["panel","📊","Panel"],["cel","🏘️","Células"],["tabl","🗂️","Tablero"],["inf","📄","Informe"],["rend","📝","Rendición"],["com","🙌","Comunidad"],["retos","🧩","Retos"],["fin","💰","Finanzas"],["equipo","⚙️","Equipo"]];

  var al=allowedTabsForMe();if(al.indexOf(S.tab)<0)S.tab=al[0];
  var allowedTabs=T.filter(function(t){return al.indexOf(t[0])>-1});
  var primaryIds=al.indexOf("asis")>-1?["ini","reg","asis","tabl"]:["ini","reg","panel","tabl"];
  var primaryTabs=allowedTabs.filter(function(t){return primaryIds.indexOf(t[0])>-1});
  var extraTabs=allowedTabs.filter(function(t){return primaryIds.indexOf(t[0])<0});
  var isExtraActive=extraTabs.some(function(t){return t[0]===S.tab});

  var navHtml=primaryTabs.map(function(t){
    return'<button aria-current="'+(S.tab===t[0])+'" onclick="switchTab(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>';
  }).join("");
  if(extraTabs.length){
    navHtml+='<button aria-current="'+(isExtraActive||S.more)+'" onclick="S.more=!S.more;draw()"><span>⋯</span>Más</button>';
  }
  $("nav").innerHTML=navHtml;

  if(S.more&&extraTabs.length){
    $("more_box").innerHTML='<div class="more-pop" onclick="if(event.target===this){S.more=false;draw()}"><div class="more-sheet"><div style="display:flex;justify-content:space-between;align-items:center"><b>Más secciones</b><button class="chip" onclick="S.more=false;draw()">✕ Cerrar</button></div><div class="more-grid">'+extraTabs.map(function(t){return'<button class="more-item" aria-current="'+(S.tab===t[0])+'" onclick="switchTab(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("")+'</div></div></div>';
  }

  $("app").innerHTML=S.tab==="reg"?reg():S.tab==="asis"?asis():S.tab==="retiro"?retiro():S.tab==="ini"?inicio():S.tab==="inf"?informe():S.tab==="rend"?rendicion():S.tab==="fin"&&canEditFinanzas()?finanzas():S.tab==="com"?comunidad():S.tab==="cel"?celulas():S.tab==="tabl"?tablero():S.tab==="retos"?retos():S.tab==="equipo"&&isPastor()?equipo():panel();
  var q=$("q");if(q)q.oninput=function(){S.q=q.value;var p=q.selectionStart;draw();var n=$("q");if(n){n.focus();n.setSelectionRange(p,p)}}
  var aq=$("aq");if(aq)aq.oninput=function(){S.aq=aq.value;var p=aq.selectionStart;draw();var n=$("aq");if(n){n.focus();n.setSelectionRange(p,p)}}
}
if(location.hash.indexOf("type=recovery")>-1)S.rec=true;
SB.auth.onAuthStateChange(function(ev){if(ev==="PASSWORD_RECOVERY"){S.rec=true;draw()}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
boot();
</script></body></html>
