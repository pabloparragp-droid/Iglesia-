var r=await SB.from("testimonies").insert({title:ti,body:b,consent:true,author_name:ME.name||U.email});if(r.error){toast("No se pudo enviar: "+r.error.message);return}await load();S.tn=false;toast("Enviado. El pastor lo revisará");draw()}
async function tpub(id){var r=await SB.from("testimonies").update({status:"publicado"}).eq("id",id);if(r.error){toast("Error: "+r.error.message);return}await load();toast("Testimonio publicado");draw()}
async function tdel(id){if(!confirm("¿Eliminar este testimonio?"))return;var r=await SB.from("testimonies").delete().eq("id",id);if(r.error){toast("Error: "+r.error.message);return}await load();draw()}
function equipo(){var o=function(a,v){return a.map(function(x){return'<option'+(x===v?" selected":"")+'>'+x+'</option>'}).join("")};
return'<div class="card"><h3>Equipo de líderes</h3><p class="note">Asigna a cada líder su célula. Quien crea una cuenta aparece aquí como líder sin célula. Solo una cuenta puede ser Servidor: es la que toma la asistencia.</p></div>'+EQ.map(function(q){var me=q.id===U.id;return'<div class="card"><b>'+esc(q.name||"Sin nombre")+(me?" (tú)":"")+'</b><label>Rol</label><select id="qr'+q.id+'"'+(me?" disabled":"")+'><option value="pastor"'+(q.role==="pastor"?" selected":"")+'>Pastor</option><option value="lider"'+(q.role==="lider"?" selected":"")+'>Líder</option><option value="discipulador"'+(q.role==="discipulador"?" selected":"")+'>Discipulador</option><option value="servidor"'+(q.role==="servidor"?" selected":"")+'>Servidor</option></select><label>Célula</label><select id="qc'+q.id+'"><option value="">Sin célula</option>'+o(CELLS,q.cell)+'</select><button class="btn" onclick="saveq(\''+q.id+'\')">Guardar</button></div>'}).join("")}
async function saveq(id){var r=await SB.from("profiles").update({role:$("qr"+id).value,cell:$("qc"+id).value||null}).eq("id",id);if(r.error){toast(r.error.message.indexOf("un_solo_servidor")>-1?"Ya hay un Servidor asignado. Cambia primero el rol del actual.":"No se pudo guardar: "+r.error.message);return}await load();toast("Equipo actualizado");draw()}
function draw(){var T=[["ini","🏠","Inicio"],["reg","👥","Registro"],["asis","✅","Asistencia"],["panel","📊","Panel"],["cel","🏘️","Células"],["tabl","🗂️","Tablero"],["com","🙌","Comunidad"],["retos","🧩","Retos"]];T.push(["equipo","⚙️","Equipo"]);
$("who").innerHTML=ME?'<span>'+esc(ME.name||U.email)+' · '+(ME.role==="lider"?"Líder"+(ME.cell?" de "+esc(ME.cell):" (sin célula asignada)"):({pastor:"Pastor",discipulador:"Discipulador",servidor:"Servidor"}[ME.role]||ME.role))+'</span><button class="chip" onclick="out()">Salir</button>':"";
$("nav").style.display=ME?"flex":"none";
if(!ME){$("app").innerHTML=authv();return}
var al=RT[ME.role]||RT.lider;if(al.indexOf(S.tab)<0)S.tab=al[0];
$("nav").innerHTML=T.filter(function(t){return al.indexOf(t[0])>-1}).map(function(t){return'<button aria-current="'+(S.tab===t[0])+'" onclick="S.tab=\''+t[0]+'\';S.sel=null;S.tb=null;S.ce=null;S.ia=null;S.pn=false;S.tn=false;draw()"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("");
$("app").innerHTML=S.tab==="reg"?reg():S.tab==="asis"?asis():S.tab==="ini"?inicio():S.tab==="com"?comunidad():S.tab==="cel"?celulas():S.tab==="tabl"?tablero():S.tab==="retos"?retos():S.tab==="equipo"&&ME.role==="pastor"?equipo():panel();
var q=$("q");if(q)q.oninput=function(){S.q=q.value;var p=q.selectionStart;draw();var n=$("q");n.focus();n.setSelectionRange(p,p)}}
boot();
</script></body></html>
