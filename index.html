function renderLessonReader(l,list){
  var idx=list.findIndex(function(x){return x.id===l.id});

  var baptized=isBaptizedRole();
  var quiz=Array.isArray(l.quiz)?l.quiz:[];
  var h='<button class="btn alt" style="margin:8px 0" onclick="S.dl_open=null;S.dl_ans={};draw()">← Volver al listado</button>';
  h+='<div class="card">';

  if(baptized)h+=' <span class="pill" style="background:#2F9E5B">Acceso libre (Bautizado)</span>';
  else if(done)h+=' <span class="pill" style="background:#2F9E5B">✓ Aprobado</span>';
  h+='<h3 style="margin-top:8px">'+esc(l.title)+'</h3>';
  h+='<div class="lbody">'+(l.content_html||'<p class="note">Sin contenido cargado aún.</p>')+'</div>';
  h+='</div>';

    h+='<p class="note">'+(baptized?"Vista de consulta para líderes y servidores (puedes probar las preguntas libremente).":(done?"Ya aprobaste este paso. Puedes repasarlo cuando quieras.":"Responde correctamente todas las preguntas para habilitar automáticamente el siguiente paso."))+'</p>';

async function submitLessonQuiz(lessonId){
  var list=n1Lessons(),l=list.filter(function(x){return x.id===lessonId})[0];if(!l)return;

  }

async function markLessonComplete(lessonId){
  var list=n1Lessons(),idx=list.findIndex(function(x){return x.id===lessonId}),l=list[idx];if(!l)return;
  var badge=l.is_final?"🛡️ Escudo de la Fe · Nivel 1 Completado":"Paso "+l.step+" completado";

function renderDiscipuladoHub(embedded){
  var list=n1Lessons();

  }

  list.forEach(function(l,idx){
    var unlocked=canOpenLesson(idx,list);
    var done=isLessonDone(l.id);
    var stText=baptized?"Disponible para lectura":(done?"Completado ✓":(unlocked?"Habilitado · Listo para presentar":"Bloqueado (aprueba el paso anterior)"));
    var icon=l.is_final?"🎓":(done?"✅":(unlocked?"📖":"🔒"));
    var bg=l.is_final?"#D6336C":(done?"#2F9E5B":(unlocked?"#1565C0":"#90A4AE"));
    h+='<div class="card"><button class="row" style="border:0;background:none;padding:0;opacity:'+(unlocked?1:.55)+'" onclick="'+(unlocked?'S.dl_open='+l.id+';S.dl_ans={};draw()':'toast(\'Aprueba el paso anterior para habilitar este\')')+'">';
    h+='<span class="av" style="background:'+bg+'">'+icon+'</span>';
    h+='<span class="grow"><b>'+(l.is_final?esc(l.title):"Paso "+l.step+": "+esc(l.title))+'</b><small>'+stText+'</small></span>';
    h+='<span class="pill" style="background:'+bg+'">'+(l.is_final?"Final":(done?"Listo":(unlocked?"Abrir":"Bloqueado")))+'</span>';
    h+='</button></div>';

  if(!S.dl_ed)return;
  if($("ed_step"))S.dl_ed.step=parseInt($("ed_step").value)||1;
  if($("ed_fin"))S.dl_ed.is_final=$("ed_fin").checked;
  if($("ed_tit"))S.dl_ed.title=$("ed_tit").value;
  if($("ed_cnt"))S.dl_ed.content_html=$("ed_cnt").value;
  S.dl_q.forEach(function(item,qi){
    if($("ed_q_"+qi))item.q=$("ed_q_"+qi).value;
    item.o.forEach(function(_,oi){if($("ed_o_"+qi+"_"+oi))item.o[oi]=$("ed_o_"+qi+"_"+oi).value});
    if($("ed_a_"+qi))item.a=parseInt($("ed_a_"+qi).value)||0;
  });
}
function renderLessonEditor(){
  var h='<button class="btn alt" style="margin:8px 0" onclick="S.dl_view=\'lessons\';S.dl_ed=null;draw()">← Volver a Lecciones Nivel 1</button>';
  if(S.dl_ed===null){
    var list=n1Lessons();
    h+='<div class="card"><h3>✏️ Editor de Lecciones · Nivel 1</h3><p class="note">Aquí puedes subir, ordenar o editar cada paso y sus preguntas de autoexamen. Los cambios se reflejan de inmediato.</p><button class="btn" onclick="openLessonEditor(0)">+ Nueva lección / paso</button></div>';
    h+=list.length?list.map(function(l){
      return'<div class="card row"><span class="av" style="background:'+(l.is_final?"#D6336C":"#1565C0")+'">'+(l.is_final?"🎓":l.step)+'</span><span class="grow"><b>'+(l.is_final?esc(l.title):"Paso "+l.step+": "+esc(l.title))+'</b><small>'+((l.quiz||[]).length)+' pregunta(s) en autoexamen</small></span><button class="chip" onclick="openLessonEditor('+l.id+')">Editar</button></div>';
    }).join(""):'<p class="note">Aún no hay pasos creados. Toca <b>+ Nueva lección / paso</b> para subir el Paso 1.</p>';
    return h;
  }
  var e=S.dl_ed;
  h+='<div class="card"><h3>'+(e.id?"Editar lección":"Nueva lección · Nivel 1")+'</h3>';
  h+='<label>Número de paso</label><input id="ed_step" type="number" min="1" max="20" value="'+e.step+'">';
  h+='<label style="display:flex;gap:8px;align-items:center"><input id="ed_fin" type="checkbox" style="width:20px;height:20px"'+(e.is_final?" checked":"")+'> Es el Resumen + Examen Final del Nivel 1</label>';
  h+='<label>Título de la lección</label><input id="ed_tit" value="'+esc(e.title)+'" placeholder="Ej. Una nueva vida en Cristo">';
  h+='<label>Contenido / Enseñanza (puedes pegar texto o etiquetas HTML como &lt;p&gt;, &lt;b&gt;, &lt;blockquote&gt;)</label><textarea id="ed_cnt" rows="7" placeholder="Escribe aquí la enseñanza bíblica del paso...">'+esc(e.content_html)+'</textarea>';
  h+='</div>';

  h+='<div class="card"><h3>Preguntas del Autoexamen</h3><p class="note">Configura las preguntas que el discípulo debe aprobar para desbloquear el siguiente paso.</p>';
  S.dl_q.forEach(function(q,qi){
    h+='<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center"><b>Pregunta '+(qi+1)+'</b>'+(S.dl_q.length>1?'<button class="chip" onclick="syncEditorDraft();S.dl_q.splice('+qi+',1);draw()">Quitar</button>':'')+'</div>';
    h+='<input id="ed_q_'+qi+'" value="'+esc(q.q)+'" placeholder="Escribe la pregunta..." style="margin-top:6px">';
    q.o.forEach(function(opt,oi){
      h+='<input id="ed_o_'+qi+'_'+oi+'" value="'+esc(opt)+'" placeholder="Opción '+(oi+1)+'" style="margin-top:6px">';
    });
    h+='<label>Respuesta correcta</label><select id="ed_a_'+qi+'">'+q.o.map(function(_,oi){return'<option value="'+oi+'"'+(q.a===oi?" selected":"")+'>Opción '+(oi+1)+'</option>'}).join("")+'</select>';
    h+='</div>';
  });
  h+='<button class="btn alt" onclick="syncEditorDraft();S.dl_q.push({q:\'\',o:[\'\',\'\',\'\'],a:0});draw()">+ Agregar otra pregunta</button>';
  h+='</div>';

  h+='<button class="btn" onclick="saveLessonEditor()">Guardar lección</button>';
  if(e.id)h+='<button class="btn alt" onclick="deleteLessonEditor('+e.id+')">Eliminar lección</button>';
  h+='<button class="btn alt" onclick="S.dl_ed=null;draw()">Cancelar</button>';
  return h;
}
async function saveLessonEditor(){
  syncEditorDraft();
  var e=S.dl_ed;
  if(!e.title.trim()){toast("Escribe el título de la lección");return}
  var cleanQuiz=S.dl_q.filter(function(q){return q.q.trim()&&q.o.some(function(x){return x.trim()})}).map(function(q){
    return{q:q.q.trim(),o:q.o.map(function(x){return x.trim()||"—"}),a:q.a}
  });
  var payload={level:1,step:e.step,title:e.title.trim(),content_html:e.content_html.trim(),quiz:cleanQuiz,is_final:!!e.is_final,updated_at:new Date().toISOString()};
  var r=e.id?await SB.from("disciple_lessons").update(payload).eq("id",e.id):await SB.from("disciple_lessons").insert(payload);
  if(r.error){toast("No se pudo guardar: "+r.error.message);return}
  await load();
  S.dl_ed=null;
  toast("Lección guardada");
  draw();
}
async function deleteLessonEditor(id){
  if(!confirm("¿Eliminar esta lección?"))return;
  var r=await SB.from("disciple_lessons").delete().eq("id",id);
  if(r.error){toast("Error: "+r.error.message);return}
  await load();
  S.dl_ed=null;
  toast("Lección eliminada");
  draw();
}

return'<div class="card"><h3>Equipo de líderes</h3><p class="note">Asigna a cada líder su célula. Quien crea una cuenta aparece aquí como líder sin célula. Todo el que tenga un rol ve el directorio sin teléfonos ni notas. Solo los coordinadores (máximo 2) toman la asistencia del culto, y cada líder la de su célula. Cada discipulador mueve solo a los discípulos que le asignes en el Tablero. Las cuentas nuevas quedan en Pendiente y no ven nada hasta que les des un rol.</p></div>'+EQ.map(function(q){var me=q.id===U.id;return'<div class="card"><b>'+esc(q.name||"Sin nombre")+(me?" (tú)":"")+'</b><label>Rol</label><select id="qr'+q.id+'"'+(me?" disabled":"")+'>'+RO.map(function(r){return'<option value="'+r[0]+'"'+(q.role===r[0]?" selected":"")+'>'+r[1]+'</option>'}).join("")+'</select><label>Célula</label><select id="qc'+q.id+'"><option value="">Sin célula</option>'+o(CELLS,q.cell)+'</select><button class="btn" onclick="saveq(\''+q.id+'\')">Guardar</button></div>'}).join("")}
async function saveq(id){var r=await SB.from("profiles").update({role:$("qr"+id).value,cell:$("qc"+id).value||null}).eq("id",id);if(r.error){toast(r.error.message.indexOf("max_coordinadores")>-1?"Ya hay 2 coordinadores. Cambia primero el rol de uno de ellos.":"No se pudo guardar: "+r.error.message);return}await load();toast("Equipo actualizado");draw()}
function draw(){var T=[["ini","🏠","Inicio"],["reg","👥","Registro"],["asis","✅","Asistencia"],["panel","📊","Panel"],["cel","🏘️","Células"],["tabl","🗂️","Tablero"],["inf","📄","Informe"],["rend","📝","Rendición"],["com","🙌","Comunidad"],["retos","🧩","Retos"],["fin","💰","Finanzas"]];T.push(["equipo","⚙️","Equipo"]);
$("who").innerHTML=ME?'<span>'+esc(ME.name||U.email)+' · '+(ME.role==="lider"?"Líder"+(ME.cell?" de "+esc(ME.cell):" (sin célula asignada)"):({pastor:"Pastor",discipulador:"Discipulador",servidor:"Servidor",coordinador:"Coordinador",discipulo:"Discípulo",pendiente:"Pendiente de aprobación"}[ME.role]||ME.role))+'</span><span><button class="chip" onclick="S.pw=true;draw()">Contraseña</button> <button class="chip" onclick="out()">Salir</button></span>':"";
$("nav").style.display=ME?"flex":"none";
if(S.rec||(S.pw&&ME)){$("nav").style.display="none";$("app").innerHTML=pwform();return}
if(!ME){$("app").innerHTML=authv();return}

var al=RT[ME.role]||[];if(al.indexOf(S.tab)<0)S.tab=al[0];
$("nav").innerHTML=T.filter(function(t){return al.indexOf(t[0])>-1}).map(function(t){return'<button aria-current="'+(S.tab===t[0])+'" onclick="S.tab=\''+t[0]+'\';S.sel=null;S.tb=null;S.ce=null;S.ia=null;S.pn=false;S.tn=false;S.ft=null;S.dl_view=null;S.dl_open=null;S.dl_ed=null;draw()"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("");
$("app").innerHTML=S.tab==="reg"?reg():S.tab==="asis"?asis():S.tab==="ini"?inicio():S.tab==="inf"?informe():S.tab==="rend"?rendicion():S.tab==="fin"&&ME.role==="pastor"?finanzas():S.tab==="com"?comunidad():S.tab==="cel"?celulas():S.tab==="tabl"?tablero():S.tab==="retos"?retos():S.tab==="equipo"&&ME.role==="pastor"?equipo():panel();
var q=$("q");if(q)q.oninput=function(){S.q=q.value;var p=q.selectionStart;draw();var n=$("q");n.focus();n.setSelectionRange(p,p)}}
if(location.hash.indexOf("type=recovery")>-1)S.rec=true;
SB.auth.onAuthStateChange(function(ev){if(ev==="PASSWORD_RECOVERY"){S.rec=true;draw()}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
boot();
