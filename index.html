ente. Meditar y practicar la Palabra forma hábitos nuevos de pensar y de vivir."},{q:"¿Qué necesidad de tu cerebro soy?",c:["Mientras estoy presente, el cerebro consolida lo aprendido.","En estudios, sobre todo con animales, se ha visto que ayudo a limpiar desechos del cerebro.","Un salmo dice que Dios me da a sus amados."],o:["Ayuno","Sueño","Silencio","Canto"],a:1,x:"Es el sueño: descansar es una necesidad que Dios dio y no es pereza.",v:"Salmo 127:2",va:"El salmista dice que Dios da el sueño a sus amados. Descansar es confiar, porque no todo depende de nuestro esfuerzo."}]},{n:"Manuscritos y lenguas",m:"Texto bíblico",c:"#2F9E5B",e:"📜",R:[{q:"¿Qué hallazgo soy?",c:["Me descubrieron desde 1947 en cuevas cerca de Qumrán.","Incluyo copias de casi todos los libros del Antiguo Testamento.","Mi copia de Isaías es mil años más antigua que las que se tenían antes."],o:["Piedra de Rosetta","Código de Hammurabi","Papiro de Oxirrinco","Rollos del Mar Muerto"],a:3,x:"Son los Rollos del Mar Muerto, que mostraron una transmisión muy fiel del texto.",v:"Isaías 40:8",va:"La palabra de nuestro Dios permanece para siempre. Que los manuscritos se hayan conservado con tanta fidelidad respalda esa confianza."},{q:"¿Qué traducción soy?",c:["Mi nombre significa «setenta».","Me hicieron en Alejandría, Egipto, desde el siglo III a.C.","Muchas citas del Antiguo Testamento en el Nuevo siguen mi versión griega."],o:["Vulgata","Peshitta","Targum","Septuaginta"],a:3,x:"Es la Septuaginta, la traducción griega del Antiguo Testamento.",v:"Hechos 17:11",va:"Los de Berea examinaban las Escrituras cada día. Conocer cómo llegó el texto hasta nosotros nos anima a estudiarlo con ganas."}]}];

function svgCartesianDiscipulado(B){
  var W=580,H=230,padL=34,padR=14,padT=22,padB=44;
  var plotW=W-padL-padR,plotH=H-padT-padB;
  var maxY=12;

    {lv:4,label:"Nivel 4",mx:12,c:"#E07B12"},

  ];

  var svg='<div class="chart-box"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Plano cartesiano de avance por niveles y lecciones">';

  for(var y=0;y<=maxY;y+=2){
    var py=padT+plotH-(y/maxY)*plotH;

  }
  // Eje Y vertical
  svg+='<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+plotH)+'" stroke="var(--mute)" stroke-width="1.5"/>';
  svg+='<text x="10" y="'+(padT+plotH/2)+'" transform="rotate(-90 10 '+(padT+plotH/2)+')" text-anchor="middle" font-size="10" font-weight="700" fill="var(--mute)">Lecciones / Pasos</text>';

  // Grupos por nivel en el eje X
  lvls.forEach(function(g,gi){
    var gx=padL+gi*gW;

        svg+='</g>';
      });

  });
  svg+='</svg></div>';
  return svg;
}

function svgGroupedFinanceChart(months,incVals,expVals){

// 4. Gráfico de Sectores / Anillo (Donut Chart para Distribución de Grupos o Categorías)
function svgDonutChart(items){
  var tot=items.reduce(function(s,x){return s+x.val},0);
  if(!tot)return'';
  var R=54,cx=72,cy=72,circ=2*Math.PI*R,acc=0;
  var svg='<div class="donut-wrap"><svg width="144" height="144" viewBox="0 0 144 144">';
  items.forEach(function(it){
    if(!it.val)return;
    var dash=(it.val/tot)*circ;
    svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+it.color+'" stroke-width="22" stroke-dasharray="'+dash.toFixed(2)+' '+circ.toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    acc+=dash;
  });
  svg+='<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">'+tot+'</text>';
  svg+='<text x="'+cx+'" y="'+(cy+13)+'" text-anchor="middle" font-size="10" fill="var(--mute)">Total</text></svg>';
  svg+='<div style="flex:1;min-width:160px">';
  items.forEach(function(it){
    var pc=Math.round((it.val/tot)*100);
    svg+='<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0;border-bottom:1px solid var(--line)"><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+it.color+';margin-right:6px"></i>'+esc(it.label)+'</span><b>'+it.val+' ('+pc+'%)</b></div>';
  });
  svg+='</div></div>';
  return svg;
}

// ===== RETOS (CON GRÁFICO RADIAL DE PROGRESO + BARRAS POR ETAPA) =====
function pts(){var t=0;for(var k in R0)t+=R0[k];return t}
function sdone(s){return RS[s].R.filter(function(r,i){return R0[s+"-"+i]!==undefined}).length}
function opn(s){return s===0||sdone(s-1)===RS[s-1].R.length}
function go(s){if(!opn(s)){toast("Completa la etapa anterior para abrir esta");return}S.rs=s;var n=0;while(n<RS[s].R.length-1&&R0[s+"-"+n]!==undefined)n++;S.ri=n;S.cl=1;S.bad=[];S.ok=false;draw()}
function pick(j){var r=RS[S.rs].R[S.ri],k=S.rs+"-"+S.ri;if(j===r.a){S.ok=true;if(R0[k]===undefined){R0[k]=Math.max(1,4-S.cl);SB.from("retos").upsert({user_id:U.id,key:k,pts:R0[k]})}}else{S.bad.push(j);toast("Esa no es. Pide otra pista o intenta de nuevo")}draw()}
function nx(){var s=RS[S.rs];if(S.ri<s.R.length-1){S.ri++;S.cl=1;S.bad=[];S.ok=false}else{S.rs=null;toast("Etapa completada")}draw()}

  var t=pts(),ti=t>=20?"Erudito":t>=10?"Estudioso":"Explorador";
  var h='<div class="card"><h3>🧩 Camino del conocimiento</h3>'+svgRadialGauge(t,30,ti);
  h+='<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px"><small class="note"><b>Avance por categoría bíblica:</b></small>';

  });
  h+='</div></div>';
  RS.forEach(function(s,i){var ok=opn(i);h+='<div class="card"><button class="row" style="border:0;background:none;padding:0;opacity:'+(ok?1:.55)+'" onclick="go('+i+')"><span class="av" style="background:'+s.c+'">'+(ok?s.e:"🔒")+'</span><span class="grow"><b>Etapa '+(i+1)+': '+s.n+'</b><small>'+s.m+' · '+sdone(i)+' de '+s.R.length+' resueltos</small></span></button></div>'});return h}
var s=RS[S.rs],r=s.R[S.ri],h='<button class="btn alt" style="margin:8px 0" onclick="S.rs=null;draw()">Volver al camino</button><div class="card"><h3>'+s.e+' '+s.n+'</h3>'+(s.nt?'<p class="note">'+esc(s.nt)+'</p>':'')+'<p><b>Acertijo '+(S.ri+1)+' de '+s.R.length+'</b></p><p>'+esc(r.q)+'</p>';
r.c.forEach(function(c,i){if(i<S.cl)h+='<div class="alert">Pista '+(i+1)+': '+esc(c)+'</div>'});
if(!S.ok&&S.cl<r.c.length)h+='<button class="btn alt" onclick="S.cl++;draw()">Pedir otra pista</button>';
h+='</div>';r.o.forEach(function(o,j){var bad=S.bad.indexOf(j)>-1;h+='<button class="chip" style="display:block;width:100%;margin:6px 0;text-align:left;padding:12px;opacity:'+(bad?.4:1)+'"'+(bad||S.ok?" disabled":"")+' onclick="pick('+j+')">'+esc(o)+(S.ok&&j===r.a?" ✔":"")+'</button>'});
if(S.ok)h+='<div class="card"><b>¡Correcto! +'+R0[S.rs+"-"+S.ri]+' puntos</b><p>'+esc(r.x)+'</p><details><summary>'+esc(r.v)+'</summary><p>'+esc(r.va)+'</p></details><button class="btn" onclick="nx()">'+(S.ri<s.R.length-1?"Siguiente acertijo":"Terminar etapa")+'</button></div>';

var BAPTIZED_ROLES=["pastor","discipulador","coordinador","lider","servidor"];

}

    h+='<p class="note">'+(baptized?"Vista de consulta para líderes y servidores (puedes probar las preguntas libremente).":(done?"Ya aprobaste este paso. Puedes repasarlo cuando quieras.":"Responde correctamente todas las preguntas para habilitar automáticamente el siguiente paso."))+'</p>';

async function submitLessonQuiz(lessonId){
  var list=n1Lessons(),l=list.filter(function(x){return x.id===lessonId})[0];if(!l)return;
  var quiz=Array.isArray(l.quiz)?l.quiz:[];
  for(var i=0;i<quiz.length;i++){
    if(S.dl_ans[i]===undefined){toast("Responde todas las preguntas antes de validar");return}
    if(S.dl_ans[i]!==quiz[i].a){toast("La pregunta "+(i+1)+" no es correcta. Repasa la lección e inténtalo de nuevo.");return}
  }
  if(isBaptizedRole()){
    toast("¡Excelente! Todas las respuestas son correctas (modo consulta).");
    return;
  }
  await markLessonComplete(lessonId);
}
async function markLessonComplete(lessonId){
  var list=n1Lessons(),idx=list.findIndex(function(x){return x.id===lessonId}),l=list[idx];if(!l)return;
  var badge=l.is_final?"🛡️ Escudo de la Fe · Nivel 1 Completado":"Paso "+l.step+" completado";
  var r=await SB.from("disciple_progress").upsert({user_id:U.id,lesson_id:l.id,level:l.level,step:l.step,is_final:l.is_final,score:100,badge:badge},{onConflict:"user_id,lesson_id"});
  if(r.error){toast("Error al guardar progreso: "+r.error.message);return}
  var nextStep=idx+1<list.length?list[idx+1].step:l.step;
  await SB.rpc("sync_disciple_level_progress",{p_level:l.level,p_next_step:nextStep,p_graduated:!!l.is_final});
  await load();
  S.dl_ans={};
  if(l.is_final){
    toast("🎉 ¡Felicitaciones! Aprobaste el Nivel 1 y ganaste tu insignia.");
    S.dl_open=null;
  }else if(idx+1<list.length){
    toast("¡Paso aprobado! Se habilitó el siguiente paso.");
    S.dl_open=list[idx+1].id;
  }else{
    toast("¡Paso completado!");
    S.dl_open=null;
  }
  draw();
}

return'<div class="card"><h3>⚙️ Equipo de líderes</h3><p class="note">Asigna a cada líder su célula. Quien crea una cuenta aparece aquí como líder sin célula. Todo el que tenga un rol ve el directorio sin teléfonos ni notas. Solo los coordinadores (máximo 2) toman la asistencia del culto, y cada líder la de su célula. Cada discipulador mueve solo a los discípulos que le asignes en el Tablero. Las cuentas nuevas quedan en Pendiente y no ven nada hasta que les des un rol.</p></div>'+EQ.map(function(q){var me=q.id===U.id;return'<div class="card"><b>'+esc(q.name||"Sin nombre")+(me?" (tú)":"")+'</b><label>Rol</label><select id="qr'+q.id+'"'+(me?" disabled":"")+'>'+RO.map(function(r){return'<option value="'+r[0]+'"'+(q.role===r[0]?" selected":"")+'>'+r[1]+'</option>'}).join("")+'</select><label>Célula</label><select id="qc'+q.id+'"><option value="">Sin célula</option>'+o(CELLS,q.cell)+'</select><button class="btn" onclick="saveq(\''+q.id+'\')">Guardar</button></div>'}).join("")}
async function saveq(id){var r=await SB.from("profiles").update({role:$("qr"+id).value,cell:$("qc"+id).value||null}).eq("id",id);if(r.error){toast(r.error.message.indexOf("max_coordinadores")>-1?"Ya hay 2 coordinadores. Cambia primero el rol de uno de ellos.":"No se pudo guardar: "+r.error.message);return}await load();toast("Equipo actualizado");draw()}

// ===== NAVEGACIÓN INFERIOR COMPACTA CON PÍLDORA ACTIVA Y MENÚ "MÁS" =====
function switchTab(id){
  S.tab=id;S.sel=null;S.tb=null;S.ce=null;S.ia=null;S.pn=false;S.tn=false;S.ft=null;S.dl_view=null;S.dl_open=null;S.dl_ed=null;S.more=false;
  draw();
}
function draw(){
  renderHeader();
  var T=[["ini","🏠","Inicio"],["reg","👥","Registro"],["asis","✅","Asistencia"],["panel","📊","Panel"],["cel","🏘️","Células"],["tabl","🗂️","Tablero"],["inf","📄","Informe"],["rend","📝","Rendición"],["com","🙌","Comunidad"],["retos","🧩","Retos"],["fin","💰","Finanzas"],["equipo","⚙️","Equipo"]];
  $("nav").style.display=ME?"flex":"none";
  $("more_box").innerHTML="";
  if(S.rec||(S.pw&&ME)){$("nav").style.display="none";$("app").innerHTML=pwform();return}
  if(!ME){$("app").innerHTML=authv();return}
  if(ME.role==="pendiente"){$("nav").style.display="none";$("app").innerHTML='<div class="card"><h3>⏳ Tu cuenta espera aprobación</h3><p>El pastor debe asignarte un rol para que puedas ver la información de la iglesia. Cuando lo haga, toca Salir y vuelve a entrar.</p></div>';return}
  var al=RT[ME.role]||[];if(al.indexOf(S.tab)<0)S.tab=al[0];
  var allowedTabs=T.filter(function(t){return al.indexOf(t[0])>-1});
  var primaryIds=al.indexOf("asis")>-1?["ini","reg","asis","tabl"]:["ini","reg","panel","tabl"];
  var primaryTabs=allowedTabs.filter(function(t){return primaryIds.indexOf(t[0])>-1});
  var extraTabs=allowedTabs.filter(function(t){return primaryIds.indexOf(t[0])<0});
  var isExtraActive=extraTabs.some(function(t){return t[0]===S.tab});

  var navHtml=primaryTabs.map(function(t){
    return'<button aria-current="'+(S.tab===t[0])+'" onclick="switchTab(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>';
  }).join("");
  if(extraTabs.length){
    navHtml+='<button aria-current="'+(isExtraActive||S.more)+'" onclick="S.more=!S.more;draw()"><span>⋯</span>Más</button>';
  }
  $("nav").innerHTML=navHtml;

  if(S.more&&extraTabs.length){
    $("more_box").innerHTML='<div class="more-pop" onclick="if(event.target===this){S.more=false;draw()}"><div class="more-sheet"><div style="display:flex;justify-content:space-between;align-items:center"><b>Más secciones</b><button class="chip" onclick="S.more=false;draw()">✕ Cerrar</button></div><div class="more-grid">'+extraTabs.map(function(t){return'<button class="more-item" aria-current="'+(S.tab===t[0])+'" onclick="switchTab(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("")+'</div></div></div>';
  }

  $("app").innerHTML=S.tab==="reg"?reg():S.tab==="asis"?asis():S.tab==="ini"?inicio():S.tab==="inf"?informe():S.tab==="rend"?rendicion():S.tab==="fin"&&ME.role==="pastor"?finanzas():S.tab==="com"?comunidad():S.tab==="cel"?celulas():S.tab==="tabl"?tablero():S.tab==="retos"?retos():S.tab==="equipo"&&ME.role==="pastor"?equipo():panel();
  var q=$("q");if(q)q.oninput=function(){S.q=q.value;var p=q.selectionStart;draw();var n=$("q");if(n){n.focus();n.setSelectionRange(p,p)}}
  var aq=$("aq");if(aq)aq.oninput=function(){S.aq=aq.value;var p=aq.selectionStart;draw();var n=$("aq");if(n){n.focus();n.setSelectionRange(p,p)}}
}
if(location.hash.indexOf("type=recovery")>-1)S.rec=true;
SB.auth.onAuthStateChange(function(ev){if(ev==="PASSWORD_RECOVERY"){S.rec=true;draw()}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
boot();
</script></body></html>
